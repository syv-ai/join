name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The org's self-hosted Hetzner runners while GitHub-hosted minutes are unavailable;
    # set the Actions variable RUNNER=ubuntu-latest to move back.
    runs-on: ${{ vars.RUNNER || 'hetzner' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm test
